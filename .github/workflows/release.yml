name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Already published
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.value }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Todavía no hay Release. Se publica ahora."
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Electron
        if: steps.existing.outputs.skip != 'true'
        working-directory: web
        run: npm ci

      - name: Publish
        if: steps.existing.outputs.skip != 'true'
        run: dotnet publish WPFUI/WPFUI.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Package
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path 'publish\TravianBotSharp.exe')) { throw 'El publish no generó TravianBotSharp.exe' }
          if (-not (Test-Path 'publish\electron\electron.exe')) { throw 'El publish no incluye la ventana Electron' }
          $zip = Join-Path $pwd 'TravianGuardBot-win-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip }
          $root = (Resolve-Path publish).Path
          $skipDir = '\\(Data|Screenshots|Logs|logs|\.playwright|refs)(\\|$)'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zip, 'Create')
          try {
            Get-ChildItem publish -Recurse -File | Where-Object {
              $_.Name -ne 'createdump.exe' -and
              $_.Extension -notin '.pdb', '.xml', '.cs', '.sln', '.csproj', '.md', '.yml', '.map' -and
              $_.FullName -notmatch $skipDir
            } | ForEach-Object {
              $name = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
              if ($name -match '^(docs|Examples HTML|\.github)/') { return }
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $_.FullName, $name) | Out-Null
            }
          } finally {
            $archive.Dispose()
          }

      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.value }}" TravianGuardBot-win-x64.zip --title "v${{ steps.version.outputs.value }}" --notes "Descomprimí el zip y ejecutá TravianBotSharp.exe. No usa el código del repositorio."
